# An AI review of a pull request on request, comment only (AI-REVIEW.md of mark1russell7/template):
# the ai-review label starts it. The repository variable AI_REVIEW_AUTO=true turns on the automatic review.
name: AI review

on:
  pull_request:
    # Not on each push. Without AI_REVIEW_AUTO, the events other than the label give only a notice.
    types: [opened, reopened, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    uses: mark1russell7/template/.github/workflows/reusable-ai-review.yml@cf5041836025a7a4df3956ac3e23f1e533dea025 # main
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
