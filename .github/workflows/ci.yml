# The CI of this repository: the shared CI of mark1russell7 (reusable-ci.yml of mark1russell7/template,
# its CI.md). The job runs each standard script that package.json has (format:check, typecheck, lint,
# test, build and lint:ste) on Linux, Windows and macOS, with Node.js 22, 24 and 26.
name: CI

on:
  push:
  pull_request:
  # release.yml starts these gates before a release
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: mark1russell7/template/.github/workflows/reusable-ci.yml@2ce0e92e367db1d0c48cfbb31e87b1fbf601ec77 # main
    with:
      # The logger runs on each OS. Node.js 22 is the oldest supported LTS version.
      os: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      node-versions: '["22", "24", "26"]'
